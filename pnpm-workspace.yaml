packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  core-js: false
  core-js-pure: false
  esbuild: true
  msgpackr-extract: false
  prisma: true
  vue-demi: true

# Patch vulnerable transitive compiler dependencies. Revalidate builds on upgrade.
overrides:
  vite: 6.4.3
  '@babel/core': 7.29.7
  esbuild: 0.25.12
  '@intlify/core-base': 9.14.5
  '@intlify/message-resolver': 9.1.11
  postcss: 8.5.28
  postcss-selector-parser: 6.1.3
  effect: 3.20.0
  deepmerge-ts: 8.0.0
  adm-zip: 0.6.1
  multer: 2.3.0
  cookie@<0.7.0: 0.7.2
  path-to-regexp@<0.1.13: 0.1.13
  send@<0.19.0: 0.19.0
  qs: 6.16.0
  shell-quote: 1.10.0
  body-parser@<1.20.6: 1.20.6
