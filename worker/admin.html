<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#f7f4ec" />
    <title>萤火管理后台</title>
    <style>
      :root {
        --bg: #f7f4ec;
        --deep: #f1ecdf;
        --surface: #fffdf8;
        --surface2: #fbf7ee;
        --ink: #2c2516;
        --text: #3a3222;
        --muted: #6b6353;
        --line: #ddd3bf;
        --line2: #e8e1d0;
        --wood: #d8c8b8;
        --wood2: #b59c7d;
        --glow: #f5c542;
        --gold: #80601a;
        --soft: #f8ecc9;
        --danger: #9c3a31;
        --danger-soft: #f7e8e4;
        --success: #3f6849;
        --success-soft: #e8f1e8;
        --shadow: 0 18px 50px rgba(79, 63, 37, 0.1);
        --serif: 'Noto Serif SC', 'Songti SC', STSong, SimSun, serif;
        --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html {
        min-width: 320px;
        background: var(--bg);
      }
      body {
        margin: 0;
        color: var(--text);
        background:
          radial-gradient(circle at 90% 0, rgba(245, 197, 66, 0.12), transparent 25rem), var(--bg);
        font: 15px/1.6 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 3px solid rgba(128, 96, 26, 0.25);
        outline-offset: 2px;
      }
      .icon {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--ink);
      }
      .brand-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border: 1px solid #d6c08d;
        border-radius: 14px;
        background: var(--soft);
        color: var(--gold);
      }
      .brand-mark:after {
        content: '';
        position: absolute;
        right: 7px;
        top: 7px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--glow);
        box-shadow: 0 0 12px var(--glow);
      }
      .brand-name {
        font: 600 19px/1.2 var(--serif);
        letter-spacing: 0.08em;
      }
      .brand-en {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 0.18em;
      }
      .primary,
      .secondary,
      .danger,
      .text-btn {
        min-height: 44px;
        border-radius: 12px;
        border: 1px solid transparent;
        padding: 9px 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 650;
        transition:
          background 0.18s,
          border-color 0.18s;
      }
      .primary {
        background: var(--wood);
        border-color: #c9b494;
        color: var(--ink);
      }
      .primary:hover {
        background: #cfbda8;
      }
      .secondary {
        background: var(--surface);
        border-color: var(--line);
        color: var(--text);
      }
      .secondary:hover {
        background: var(--surface2);
        border-color: #cbbfa8;
      }
      .danger {
        background: var(--danger);
        color: #fff;
      }
      .danger:hover {
        background: #853128;
      }
      .text-btn {
        padding-inline: 10px;
        background: transparent;
        color: var(--muted);
      }
      .text-btn:hover {
        background: var(--deep);
        color: var(--ink);
      }
      input,
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fffefa;
        color: var(--text);
        padding: 10px 13px;
      }
      input::placeholder,
      textarea::placeholder {
        color: #948b7c;
      }
      .login-screen {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 28px 18px;
      }
      .login-card {
        width: min(100%, 430px);
        padding: 38px;
        border: 1px solid var(--line);
        border-radius: 26px;
        background: rgba(255, 253, 248, 0.95);
        box-shadow: var(--shadow);
      }
      .login-card h1 {
        margin: 42px 0 8px;
        color: var(--ink);
        font: 600 29px/1.35 var(--serif);
      }
      .login-card > p {
        margin: 0 0 26px;
        color: var(--muted);
      }
      .field {
        display: grid;
        gap: 8px;
      }
      .field label {
        color: var(--ink);
        font-size: 13px;
        font-weight: 650;
      }
      .input-wrap,
      .search {
        position: relative;
      }
      .input-wrap .icon,
      .search .icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .input-wrap input,
      .search input {
        padding-left: 44px;
      }
      .login-submit {
        width: 100%;
        margin-top: 18px;
      }
      .form-error {
        min-height: 23px;
        margin: 12px 0 0 !important;
        color: var(--danger) !important;
        font-size: 13px;
      }
      .login-note {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 24px;
        padding-top: 18px;
        border-top: 1px solid var(--line2);
        color: var(--muted);
        font-size: 12px;
      }
      .shell {
        min-height: 100dvh;
        display: grid;
        grid-template-columns: 236px minmax(0, 1fr);
      }
      .sidebar {
        position: sticky;
        top: 0;
        height: 100dvh;
        padding: 24px 16px 18px;
        border-right: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.76);
        backdrop-filter: blur(16px);
        display: flex;
        flex-direction: column;
      }
      .sidebar .brand {
        padding: 4px 8px 28px;
      }
      .nav {
        display: grid;
        gap: 6px;
      }
      .nav-btn {
        position: relative;
        min-height: 46px;
        width: 100%;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 11px;
        text-align: left;
      }
      .nav-btn:hover {
        background: var(--surface2);
        color: var(--ink);
      }
      .nav-btn.active {
        background: var(--soft);
        color: var(--ink);
        font-weight: 650;
      }
      .badge {
        min-width: 22px;
        height: 22px;
        margin-left: auto;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--danger);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
      }
      .sidebar-foot {
        margin-top: auto;
        padding-top: 18px;
        border-top: 1px solid var(--line2);
      }
      .admin-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        background: var(--soft);
        color: var(--gold);
        font: 700 15px var(--serif);
      }
      .admin-copy {
        min-width: 0;
        flex: 1;
      }
      .admin-copy strong,
      .admin-copy small {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .admin-copy strong {
        color: var(--ink);
        font-size: 13px;
      }
      .admin-copy small {
        color: var(--muted);
        font-size: 11px;
      }
      .content {
        min-width: 0;
        padding: 0 34px 48px;
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        min-height: 76px;
        margin: 0 -34px;
        padding: 13px 34px;
        display: flex;
        align-items: center;
        gap: 20px;
        border-bottom: 1px solid rgba(221, 211, 191, 0.72);
        background: rgba(247, 244, 236, 0.88);
        backdrop-filter: blur(16px);
      }
      .topbar-copy {
        min-width: 0;
        flex: 1;
      }
      .topbar h1 {
        margin: 0;
        color: var(--ink);
        font: 600 22px/1.35 var(--serif);
      }
      .topbar p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 12px;
      }
      .main {
        max-width: 1320px;
        margin: auto;
        padding-top: 28px;
      }
      .view {
        animation: fade 0.18s ease;
      }
      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      .section-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }
      .section-head h2 {
        margin: 0;
        color: var(--ink);
        font: 600 20px/1.4 var(--serif);
      }
      .section-head p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }
      .metric,
      .panel {
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 253, 248, 0.88);
        box-shadow: 0 5px 20px rgba(79, 63, 37, 0.035);
      }
      .metric {
        min-height: 142px;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .metric:after {
        content: '';
        position: absolute;
        width: 82px;
        height: 82px;
        right: -30px;
        top: -30px;
        border-radius: 50%;
        background: rgba(245, 197, 66, 0.11);
      }
      .metric-icon {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 11px;
        background: var(--surface2);
        color: var(--gold);
      }
      .metric-icon .icon {
        width: 18px;
      }
      .metric-label {
        margin-top: 17px;
        color: var(--muted);
        font-size: 12px;
      }
      .metric-value {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 2px;
      }
      .metric-value strong {
        color: var(--ink);
        font: 650 29px/1.2 var(--serif);
      }
      .metric-value span {
        color: var(--success);
        font-size: 11px;
      }
      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(300px, 0.8fr);
        gap: 16px;
        margin-top: 16px;
      }
      .panel {
        padding: 20px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }
      .panel-head h3 {
        margin: 0;
        color: var(--ink);
        font: 600 17px/1.4 var(--serif);
      }
      .panel-head small {
        color: var(--muted);
      }
      .quick-list,
      .status-list {
        display: grid;
        gap: 10px;
      }
      .quick-item {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 11px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line2);
      }
      .quick-item:last-child {
        border-bottom: 0;
      }
      .quick-copy {
        min-width: 0;
      }
      .quick-copy strong,
      .quick-copy span {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .quick-copy strong {
        color: var(--ink);
        font-size: 13px;
      }
      .quick-copy span {
        color: var(--muted);
        font-size: 11px;
      }
      .status-list {
        gap: 16px;
      }
      .status-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 7px;
        color: var(--muted);
        font-size: 12px;
      }
      .status-head strong {
        color: var(--ink);
      }
      .bar {
        height: 8px;
        border-radius: 99px;
        background: var(--deep);
        overflow: hidden;
      }
      .bar span {
        display: block;
        height: 100%;
        min-width: 3px;
        border-radius: inherit;
        background: var(--wood2);
      }
      .bar.pending span {
        background: var(--glow);
      }
      .bar.rejected span {
        background: #c97b70;
      }
      .system-note {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-top: 18px;
        padding: 12px;
        border-radius: 12px;
        background: var(--success-soft);
        color: var(--success);
        font-size: 12px;
      }
      .live {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4f8a5c;
        box-shadow: 0 0 0 5px rgba(79, 138, 92, 0.11);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 16px;
      }
      .segments {
        display: flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--surface);
        overflow: auto;
      }
      .segment {
        min-height: 36px;
        white-space: nowrap;
        padding: 6px 13px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--muted);
      }
      .segment.active {
        background: var(--soft);
        color: var(--ink);
        font-weight: 650;
      }
      .search {
        width: min(100%, 320px);
      }
      .search .icon {
        width: 18px;
      }
      .search input {
        min-height: 42px;
      }
      .story-list,
      .feedback-list {
        display: grid;
        gap: 14px;
      }
      .story-card {
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--surface);
      }
      .story-top {
        display: flex;
        align-items: center;
        gap: 11px;
      }
      .story-author {
        min-width: 0;
        flex: 1;
      }
      .story-author strong,
      .story-author span {
        display: block;
      }
      .story-author strong {
        color: var(--ink);
        font-size: 13px;
      }
      .story-author span {
        color: var(--muted);
        font-size: 11px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        padding: 5px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 650;
      }
      .pill:before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
      }
      .pending-pill {
        background: var(--soft);
        color: var(--gold);
      }
      .published-pill,
      .active-pill {
        background: var(--success-soft);
        color: var(--success);
      }
      .rejected-pill,
      .suspended-pill {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .story-body {
        margin: 16px 0;
        padding: 16px;
        border-radius: 13px;
        background: var(--surface2);
      }
      .story-body h3 {
        margin: 0 0 7px;
        color: var(--ink);
        font: 600 17px/1.4 var(--serif);
      }
      .story-body p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .reason {
        margin-top: 10px;
        color: var(--danger);
        font-size: 12px;
      }
      .story-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 9px;
        padding-top: 14px;
        border-top: 1px solid var(--line2);
      }
      .empty {
        padding: 68px 20px;
        border: 1px dashed #cfc3ad;
        border-radius: 18px;
        text-align: center;
        color: var(--muted);
        background: rgba(255, 253, 248, 0.5);
      }
      .empty .icon {
        width: 34px;
        height: 34px;
        margin-bottom: 8px;
        color: var(--wood2);
      }
      .empty strong {
        display: block;
        margin-bottom: 3px;
        color: var(--ink);
        font-family: var(--serif);
      }
      .table-panel {
        padding: 0;
        overflow: hidden;
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
      }
      .data-table th,
      .data-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--line2);
        text-align: left;
        vertical-align: middle;
      }
      .data-table th {
        color: var(--muted);
        background: var(--surface2);
        font-size: 11px;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      .data-table tbody tr:hover {
        background: #fffaf0;
      }
      .data-table tr:last-child td {
        border-bottom: 0;
      }
      .user-cell {
        min-width: 180px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .user-main strong,
      .user-main small {
        display: block;
      }
      .user-main strong {
        color: var(--ink);
        font-size: 13px;
      }
      .user-main small {
        color: var(--muted);
        font-size: 11px;
      }
      .mono {
        color: var(--muted);
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
      }
      .counts {
        display: flex;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .counts strong {
        color: var(--ink);
      }
      .row-action {
        min-height: 36px;
        padding: 5px 10px;
        font-size: 12px;
      }
      .feedback-card {
        display: grid;
        grid-template-columns: 90px minmax(0, 1fr) auto;
        gap: 16px;
        align-items: start;
        padding: 18px 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      .category {
        display: inline-flex;
        justify-content: center;
        padding: 5px 8px;
        border-radius: 8px;
        background: var(--deep);
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
      }
      .category-problem {
        background: var(--danger-soft);
        color: var(--danger);
      }
      .category-privacy {
        background: #eeeaf8;
        color: #62518b;
      }
      .feedback-copy p {
        margin: 0 0 8px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--ink);
      }
      .feedback-copy small,
      .feedback-time {
        color: var(--muted);
        font-size: 11px;
      }
      .feedback-time {
        white-space: nowrap;
      }
      .skeleton {
        position: relative;
        overflow: hidden;
        min-height: 120px;
        background: var(--surface2);
      }
      .skeleton:after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        animation: shimmer 1.2s infinite;
      }
      @keyframes shimmer {
        to {
          transform: translateX(100%);
        }
      }
      .toast {
        position: fixed;
        z-index: 100;
        right: 22px;
        bottom: 22px;
        max-width: min(380px, calc(100vw - 32px));
        padding: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--ink);
        color: #fff;
        box-shadow: var(--shadow);
        transform: translateY(18px);
        opacity: 0;
        pointer-events: none;
        transition: 0.18s;
      }
      .toast.show {
        transform: none;
        opacity: 1;
      }
      .toast.error {
        background: var(--danger);
      }
      dialog {
        width: min(92vw, 440px);
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--surface);
        color: var(--text);
        box-shadow: 0 24px 80px rgba(44, 37, 22, 0.22);
      }
      dialog::backdrop {
        background: rgba(44, 37, 22, 0.34);
        backdrop-filter: blur(3px);
      }
      .dialog-body {
        padding: 24px;
      }
      .dialog-body h2 {
        margin: 0 0 8px;
        color: var(--ink);
        font: 600 20px/1.4 var(--serif);
      }
      .dialog-body p {
        margin: 0;
        color: var(--muted);
      }
      .dialog-field {
        margin-top: 16px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 9px;
        padding: 15px 24px;
        border-top: 1px solid var(--line2);
        background: var(--surface2);
      }
      @media (max-width: 1050px) {
        .metrics {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dashboard-grid {
          grid-template-columns: 1fr;
        }
        .data-table th:nth-child(4),
        .data-table td:nth-child(4) {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .shell {
          display: block;
        }
        .sidebar {
          position: sticky;
          z-index: 40;
          top: 0;
          width: 100%;
          height: auto;
          padding: calc(10px + env(safe-area-inset-top)) 12px 8px;
          border: 0;
          border-bottom: 1px solid var(--line);
        }
        .sidebar .brand,
        .sidebar-foot {
          display: none;
        }
        .nav {
          display: flex;
          gap: 4px;
          overflow: auto;
          scrollbar-width: none;
        }
        .nav::-webkit-scrollbar {
          display: none;
        }
        .nav-btn {
          flex: 0 0 auto;
          width: auto;
          min-height: 42px;
          padding: 8px 11px;
        }
        .nav-btn .icon {
          width: 18px;
        }
        .badge {
          position: absolute;
          right: 1px;
          top: 1px;
          min-width: 18px;
          height: 18px;
          padding: 0 4px;
        }
        .content {
          padding: 0 14px 36px;
        }
        .topbar {
          position: relative;
          min-height: 68px;
          margin: 0 -14px;
          padding: 12px 14px;
          background: transparent;
          backdrop-filter: none;
        }
        .topbar p {
          display: none;
        }
        .main {
          padding-top: 18px;
        }
        .toolbar {
          align-items: stretch;
          flex-direction: column;
        }
        .search {
          width: 100%;
        }
        .feedback-card {
          grid-template-columns: 1fr;
          gap: 10px;
        }
        .table-panel {
          background: transparent;
          border: 0;
          box-shadow: none;
          overflow: visible;
        }
        .data-table,
        .data-table tbody {
          display: block;
        }
        .data-table thead {
          display: none;
        }
        .data-table tr {
          display: grid;
          gap: 11px;
          margin-bottom: 12px;
          padding: 16px;
          border: 1px solid var(--line);
          border-radius: 16px;
          background: var(--surface);
        }
        .data-table td,
        .data-table td:nth-child(4) {
          display: flex;
          justify-content: space-between;
          gap: 14px;
          padding: 0;
          border: 0;
        }
        .data-table td:before {
          content: attr(data-label);
          color: var(--muted);
          font-size: 11px;
        }
        .data-table td:first-child:before {
          display: none;
        }
        .data-table td:first-child {
          display: block;
        }
        .data-table td:last-child {
          justify-content: flex-end;
          padding-top: 9px;
          border-top: 1px solid var(--line2);
        }
      }
      @media (max-width: 520px) {
        .login-card {
          padding: 28px 22px;
          border-radius: 22px;
        }
        .metrics {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .metric {
          min-height: 126px;
          padding: 15px;
        }
        .metric-label {
          margin-top: 12px;
        }
        .metric-value strong {
          font-size: 25px;
        }
        .story-card {
          padding: 16px;
        }
        .story-actions {
          align-items: stretch;
          flex-direction: column-reverse;
        }
        .story-actions button {
          width: 100%;
        }
        .topbar .secondary span {
          display: none;
        }
        .dialog-actions {
          flex-direction: column-reverse;
        }
        .dialog-actions button {
          width: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>

    <section id="loginScreen" class="login-screen">
      <form id="loginForm" class="login-card">
        <div class="brand">
          <span class="brand-mark"
            ><svg class="icon"><use href="#i-firefly" /></svg></span
          ><span
            ><span class="brand-name">萤火</span><span class="brand-en">FIREFLY ADMIN</span></span
          >
        </div>
        <h1>管理后台</h1>
        <p>审核社区内容，查看用户与产品运行情况。</p>
        <div class="field">
          <label for="tokenInput">管理员口令</label>
          <div class="input-wrap">
            <svg class="icon"><use href="#i-lock" /></svg
            ><input
              id="tokenInput"
              type="password"
              autocomplete="current-password"

      <aside class="sidebar">

    <script>
      const $ = (id) => document.getElementById(id);
      const state = {
        token: sessionStorage.getItem('yinghuo.admin') || '',
        view: 'overview',
        overview: null,
        stories: [],
        users: [],
        feedback: [],
        storyFilter: 'pending',
        userFilter: 'all',
        feedbackFilter: 'all',
        search: '',
        busy: false,
      };
      const pages = {
        overview: ['数据概览', '查看萤火当前的运营与社区状态'],
        stories: ['故事审核', '审核公开申请，维护广场内容质量'],
        users: ['用户管理', '查看账号状态与使用情况'],
        feedback: ['意见反馈', '集中查看用户提交的问题与建议'],
      };
      const icon = (name) =>
        '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
      const esc = (value) =>
        String(value ?? '').replace(
          /[&<>'"]/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c],
        );
      function date(value, short = false) {
        if (!value) return '—';
        const d = new Date(value);
        if (Number.isNaN(d.getTime())) return '—';
        return new Intl.DateTimeFormat(
          'zh-CN',
          short
            ? { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }
            : {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
              },
        ).format(d);
      }
      function toast(message, error = false) {
        const n = $('toast');
        n.textContent = message;
        n.className = 'toast show' + (error ? ' error' : '');
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => (n.className = 'toast'), 2600);
      }
      async function api(path, method = 'GET', data) {
        const response = await fetch('/api/v1/admin/' + path, {
          method,
          headers: { authorization: 'Bearer ' + state.token, 'content-type': 'application/json' },
          ...(data === undefined ? {} : { body: JSON.stringify(data) }),
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 401) logout(false);
          throw Error(result?.error?.message || '请求失败，请稍后重试');
        }
        return result;
      }
      function busy(value) {
        state.busy = value;
        $('refreshButton').disabled = value;
        $('loginButton').disabled = value;
        $('loginButton').textContent = value ? '正在验证…' : '进入后台';
      }
      async function login(event) {
        event?.preventDefault();
        state.token = $('tokenInput').value.trim() || state.token;
        if (!state.token) return;
        busy(true);
        $('loginError').textContent = '';
        try {
          state.overview = await api('overview');
          sessionStorage.setItem('yinghuo.admin', state.token);
          $('tokenInput').value = '';
          $('loginScreen').hidden = true;
          $('shell').hidden = false;
          badge();
          render();
        } catch (error) {
          $('loginError').textContent = error.message;
          $('loginScreen').hidden = false;
          $('shell').hidden = true;
        } finally {
          busy(false);
        }
      }
      function logout(message = true) {
        state.token = '';
        sessionStorage.removeItem('yinghuo.admin');
        $('shell').hidden = true;
        $('loginScreen').hidden = false;
        $('loginError').textContent = '';
        if (message) toast('已安全退出后台');
      }
      function badge() {
        const count = state.overview?.stories?.pending || 0;
        $('pendingBadge').textContent = count > 99 ? '99+' : count;
        $('pendingBadge').hidden = count < 1;
      }
      const skeletons = () =>
        '<div class="metrics">' +
        Array.from({ length: 4 }, () => '<div class="metric skeleton"></div>').join('') +
        '</div>';
      const empty = (title, desc) =>
        '<div class="empty">' +
        icon('inbox') +
        '<strong>' +
        esc(title) +
        '</strong><span>' +
        esc(desc) +
        '</span></div>';
      async function refresh(silent = false) {
        if (state.busy) return;
        busy(true);
        try {
          if (state.view === 'overview') state.overview = await api('overview');
          if (state.view === 'stories')
            state.stories = (await api('stories?status=' + state.storyFilter)).items;
          if (state.view === 'users') state.users = (await api('users')).items;
          if (state.view === 'feedback') state.feedback = (await api('feedback')).items;
          if (state.view !== 'overview') state.overview = await api('overview');
          badge();
          render();
          if (!silent) toast('数据已更新');
        } catch (error) {
          toast(error.message, true);
          render();
        } finally {
          busy(false);
        }
      }
      async function switchView(view) {
        if (!pages[view]) return;
        state.view = view;
        state.search = '';
        document
          .querySelectorAll('[data-view]')
          .forEach((b) => b.classList.toggle('active', b.dataset.view === view));
        $('pageTitle').textContent = pages[view][0];
        $('pageDescription').textContent = pages[view][1];
        $('main').innerHTML = '<section class="view">' + skeletons() + '</section>';
        await refresh(true);
      }
      function metric(label, value, iconName, note = '') {
        return (
          '<article class="metric"><span class="metric-icon">' +
          icon(iconName) +
          '</span><div class="metric-label">' +
          esc(label) +
          '</div><div class="metric-value"><strong>' +
          Number(value || 0).toLocaleString('zh-CN') +
          '</strong>' +
          (note ? '<span>' + esc(note) + '</span>' : '') +
          '</div></article>'
        );
      }
      function overview() {
        const d = state.overview;
        if (!d) return '<section class="view">' + skeletons() + '</section>';
        const pub = d.stories.pending + d.stories.published + d.stories.rejected,
          total = Math.max(1, pub);
        const bars = [
          ['已发布', d.stories.published, ''],
          ['待审核', d.stories.pending, 'pending'],
          ['已退回', d.stories.rejected, 'rejected'],
        ]
          .map(
            (x) =>
              '<div><div class="status-head"><span>' +
              x[0] +
              '</span><strong>' +
              x[1] +
              '</strong></div><div class="bar ' +
              x[2] +
              '"><span style="width:' +
              Math.round((x[1] / total) * 100) +
              '%"></span></div></div>',
          )
          .join('');
        return (
          '<section class="view"><div class="section-head"><div><h2>今日概况</h2><p>数据更新时间：' +
          date(d.updatedAt) +
          '</p></div></div><div class="metrics">' +
          metric(
            '用户总数',
            d.users.total,
            'users',
            d.users.today ? '今日 +' + d.users.today : '',
          ) +
          metric('人物空间', d.profiles, 'profile') +
          metric('记忆总数', d.memories, 'book') +
          metric('对话消息', d.messages, 'chat') +
          '</div><div class="dashboard-grid"><article class="panel"><div class="panel-head"><div><h3>待处理故事</h3><small>' +
          (d.stories.pending ? '还有 ' + d.stories.pending + ' 条等待审核' : '审核队列已清空') +
          '</small></div><button class="text-btn" data-go="stories">查看全部</button></div><div id="quickStories" class="quick-list">' +
          (d.stories.pending
            ? '<div class="skeleton" style="min-height:150px;border-radius:12px"></div>'
            : empty('没有待审核内容', '新的公开申请会出现在这里')) +
          '</div></article><article class="panel"><div class="panel-head"><div><h3>广场内容状态</h3><small>公开内容共 ' +
          pub +
          ' 条</small></div></div><div class="status-list">' +
          bars +
          '</div><div class="system-note"><span class="live"></span><span>服务运行正常，数据库连接正常</span></div></article></div><div class="dashboard-grid"><article class="panel"><div class="panel-head"><div><h3>用户状态</h3><small>账号与找回能力</small></div><button class="text-btn" data-go="users">管理用户</button></div><div class="status-list"><div><div class="status-head"><span>正常账号</span><strong>' +
          d.users.active +
          '</strong></div><div class="bar"><span style="width:' +
          Math.round((d.users.active / Math.max(1, d.users.total)) * 100) +
          '%"></span></div></div><div><div class="status-head"><span>已保存手机号</span><strong>' +
          d.users.phoneBound +
          '</strong></div><div class="bar pending"><span style="width:' +
          Math.round((d.users.phoneBound / Math.max(1, d.users.total)) * 100) +
          '%"></span></div></div><div><div class="status-head"><span>已暂停账号</span><strong>' +
          d.users.suspended +
          '</strong></div><div class="bar rejected"><span style="width:' +
          Math.round((d.users.suspended / Math.max(1, d.users.total)) * 100) +
          '%"></span></div></div></div></article><article class="panel"><div class="panel-head"><div><h3>意见反馈</h3><small>累计 ' +
          d.feedback.total +
          ' 条</small></div><button class="text-btn" data-go="feedback">查看反馈</button></div><div class="quick-list">' +
          [
            ['问', '问题反馈', d.feedback.problem],
            ['议', '功能建议', d.feedback.suggestion],
            ['隐', '隐私相关', d.feedback.privacy],
          ]
            .map(
              (x) =>
                '<div class="quick-item"><span class="avatar">' +
                x[0] +
                '</span><div class="quick-copy"><strong>' +
                x[1] +
                '</strong><span>用户提交的' +
                x[1] +
                '</span></div><strong>' +
                x[2] +
                '</strong></div>',
            )
            .join('') +
          '</div></article></div></section>'
        );
      }
      async function quickStories() {
        if (state.view !== 'overview' || !state.overview?.stories?.pending) return;
        try {
          const items = (await api('stories?status=pending')).items.slice(0, 4),
            root = $('quickStories');
          if (!root) return;
          root.innerHTML = items
            .map(
              (item) =>
                '<button class="quick-item text-btn" data-go="stories" style="width:100%;text-align:left"><span class="avatar">' +
                esc((item.authorName || '萤').slice(0, 1)) +
                '</span><span class="quick-copy"><strong>' +
                esc(item.title || '未命名故事') +
                '</strong><span>' +
                esc((item.body || '').replace(/\s+/g, ' ').slice(0, 42)) +
                '</span></span><small>' +
                date(item.createdAt, true) +
                '</small></button>',
            )
            .join('');
        } catch {}
      }
      const storyState = (s) =>
        ({
          pending: ['审核中', 'pending-pill'],
          published: ['已发布', 'published-pill'],
          rejected: ['已退回', 'rejected-pill'],
        })[s] || [s, ''];
      function stories() {
        const q = state.search.trim().toLowerCase(),
          items = state.stories.filter(
            (x) => !q || [x.title, x.body, x.authorName].join(' ').toLowerCase().includes(q),
          );
        const cards = items
          .map((item) => {
            const s = storyState(item.moderation),
              approve =
                item.moderation !== 'published'
                  ? '<button class="primary" data-story-action="published" data-id="' +
                    item.id +
                    '">' +
                    icon('check') +
                    '审核通过并发布</button>'
                  : '',
              reject =
                item.moderation !== 'rejected'
                  ? '<button class="secondary" data-story-action="rejected" data-id="' +
                    item.id +
                    '">' +
                    icon('x') +
                    '退回修改</button>'
                  : '';
            return (
              '<article class="story-card"><div class="story-top"><span class="avatar">' +
              esc((item.authorName || '萤').slice(0, 1)) +
              '</span><div class="story-author"><strong>' +
              esc(item.authorName || '一位萤火朋友') +
              '</strong><span>' +
              date(item.createdAt) +
              '</span></div><span class="pill ' +
              s[1] +
              '">' +
              s[0] +
              '</span></div><div class="story-body"><h3>' +
              esc(item.title || '未命名故事') +
              '</h3><p>' +
              esc(item.body || '') +
              '</p>' +
              (item.moderationReason
                ? '<div class="reason">审核说明：' + esc(item.moderationReason) + '</div>'
                : '') +
              '</div><div class="story-actions">' +
              reject +
              approve +
              '</div></article>'
            );
          })
          .join('');
        return (
          '<section class="view"><div class="toolbar"><div class="segments">' +
          [
            ['pending', '待审核'],
            ['published', '已发布'],
            ['rejected', '已退回'],
          ]
            .map(
              (x) =>
                '<button class="segment ' +
                (state.storyFilter === x[0] ? 'active' : '') +
                '" data-story-filter="' +
                x[0] +
                '">' +
                x[1] +
                (x[0] === 'pending' && state.overview?.stories?.pending
                  ? '（' + state.overview.stories.pending + '）'
                  : '') +
                '</button>',
            )
            .join('') +
          '</div><label class="search">' +
          icon('search') +
          '<input id="storySearch" type="search" value="' +
          esc(state.search) +
          '" placeholder="搜索标题或内容" aria-label="搜索故事"></label></div><div class="story-list">' +
          (cards ||
            empty(
              q ? '没有搜索结果' : '当前没有内容',
              q ? '换个关键词试试' : '新的内容会显示在这里',
            )) +
          '</div></section>'
        );
      }
      const account = (k) =>
        ({ guest: '访客账号', bound: '已绑定账号', merged: '已合并账号' })[k] || k || '访客账号';
      function users() {
        const q = state.search.trim().toLowerCase(),
          items = state.users.filter(
            (x) =>
              (state.userFilter === 'all' || x.status === state.userFilter) &&
              (!q ||
                [x.displayName, x.familyCode, x.phoneLast4, x.id]
                  .join(' ')
                  .toLowerCase()
                  .includes(q)),
          );
        const rows = items
          .map(
            (x) =>
              '<tr><td><div class="user-cell"><span class="avatar">' +
              esc((x.displayName || x.familyCode || '萤').slice(0, 1)) +
              '</span><span class="user-main"><strong>' +
              esc(x.displayName || '萤火用户') +
              '</strong><small>' +
              esc(account(x.accountKind)) +
              '</small></span></div></td><td data-label="找回卡"><span class="mono">' +
              esc(x.familyCode || '—') +
              '</span></td><td data-label="手机">' +
              (x.phoneLast4 ? '尾号 ' + esc(x.phoneLast4) : '未保存') +
              '</td><td data-label="内容"><span class="counts"><span>空间 <strong>' +
              x.profileCount +
              '</strong></span><span>故事 <strong>' +
              x.storyCount +
              '</strong></span></span></td><td data-label="注册时间">' +
              date(x.createdAt, true) +
              '</td><td data-label="状态"><span class="pill ' +
              (x.status === 'active' ? 'active-pill' : 'suspended-pill') +
              '">' +
              (x.status === 'active' ? '正常' : '已暂停') +
              '</span></td><td data-label="操作"><button class="secondary row-action" data-user-action="' +
              (x.status === 'active' ? 'suspended' : 'active') +
              '" data-id="' +
              x.id +
              '" data-name="' +
              esc(x.displayName || x.familyCode || '该用户') +
              '">' +
              (x.status === 'active' ? '暂停账号' : '恢复账号') +
              '</button></td></tr>',
          )
          .join('');
        return (
          '<section class="view"><div class="toolbar"><div class="segments">' +
          [
            ['all', '全部用户'],
            ['active', '正常'],
            ['suspended', '已暂停'],
          ]
            .map(
              (x) =>
                '<button class="segment ' +
                (state.userFilter === x[0] ? 'active' : '') +
                '" data-user-filter="' +
                x[0] +
                '">' +
                x[1] +
                '</button>',
            )
            .join('') +
          '</div><label class="search">' +
          icon('search') +
          '<input id="userSearch" type="search" value="' +
          esc(state.search) +
          '" placeholder="搜索找回卡、尾号或用户 ID" aria-label="搜索用户"></label></div>' +
          (rows
            ? '<div class="panel table-panel"><table class="data-table"><thead><tr><th>用户</th><th>找回卡</th><th>手机</th><th>内容</th><th>注册时间</th><th>状态</th><th>操作</th></tr></thead><tbody>' +
              rows +
              '</tbody></table></div>'
            : empty(q ? '没有搜索结果' : '暂无用户', '符合条件的用户会显示在这里')) +
          '</section>'
        );
      }
      const category = (c) =>
        ({ problem: '问题反馈', suggestion: '功能建议', privacy: '隐私相关' })[c] || '其他反馈';
      function feedback() {
        const items = state.feedback.filter(
            (x) => state.feedbackFilter === 'all' || x.category === state.feedbackFilter,
          ),
          cards = items
            .map(
              (x) =>
                '<article class="feedback-card"><span class="category category-' +
                x.category +
                '">' +
                category(x.category) +
                '</span><div class="feedback-copy"><p>' +
                esc(x.body) +
                '</p><small>用户：' +
                esc(x.userName || x.familyCode || x.userId.slice(0, 8)) +
                (x.pageUrl ? ' · 页面：' + esc(x.pageUrl) : '') +
                '</small></div><time class="feedback-time">' +
                date(x.createdAt, true) +
                '</time></article>',
            )
            .join('');
        return (
          '<section class="view"><div class="toolbar"><div class="segments">' +
          [
            ['all', '全部'],
            ['problem', '问题'],
            ['suggestion', '建议'],
            ['privacy', '隐私'],
          ]
            .map(
              (x) =>
                '<button class="segment ' +
                (state.feedbackFilter === x[0] ? 'active' : '') +
                '" data-feedback-filter="' +
                x[0] +
                '">' +
                x[1] +
                '</button>',
            )
            .join('') +
          '</div></div><div class="feedback-list">' +
          (cards || empty('暂无反馈', '用户提交的意见会显示在这里')) +
          '</div></section>'
        );
      }
      function render() {
        const y = scrollY;
        $('main').innerHTML =
          state.view === 'overview'
            ? overview()
            : state.view === 'stories'
              ? stories()
              : state.view === 'users'
                ? users()
                : feedback();
        requestAnimationFrame(() => scrollTo(0, y));
        if (state.view === 'overview') quickStories();
      }
      function ask({ title, description, confirmLabel = '确认', danger = false, reason = false }) {
        return new Promise((resolve) => {
          const d = $('confirmDialog');
          $('dialogTitle').textContent = title;
          $('dialogDescription').textContent = description;
          $('dialogConfirm').textContent = confirmLabel;
          $('dialogConfirm').className = danger ? 'danger' : 'primary';
          $('dialogField').hidden = !reason;
          $('dialogReason').value = '';
          d.onclose = () =>
            resolve(
              d.returnValue === 'confirm'
                ? reason
                  ? $('dialogReason').value.trim()
                  : true
                : false,
            );
          d.showModal();
          if (reason) setTimeout(() => $('dialogReason').focus(), 80);
        });
      }
      async function moderate(id, decision) {
        let reason = '';
        if (decision === 'published') {
          if (
            !(await ask({
              title: '确认公开这个故事？',
              description: '通过后，故事会立即显示在萤火广场。',
              confirmLabel: '通过并发布',
            }))
          )
            return;
        } else {
          reason = await ask({
            title: '退回这个公开申请？',
            description: '请说明需要修改的内容，作者会看到退回原因。',
            confirmLabel: '确认退回',
            danger: true,
            reason: true,
          });
          if (!reason) return;
        }
        try {
          await api('stories/' + id, 'PATCH', { decision, reason });
          toast(decision === 'published' ? '故事已发布' : '故事已退回');
          await refresh(true);
        } catch (error) {
          toast(error.message, true);
        }
      }
      async function userStatus(id, status, name) {
        const stop = status === 'suspended';
        if (
          !(await ask({
            title: stop ? '暂停这个账号？' : '恢复这个账号？',
            description: stop
              ? name + ' 将无法继续登录和使用萤火，之后可以在后台恢复。'
              : name + ' 将重新获得登录和使用权限。',
            confirmLabel: stop ? '确认暂停' : '确认恢复',
            danger: stop,
          }))
        )
          return;
        try {
          await api('users/' + id, 'PATCH', { status });
          toast(stop ? '账号已暂停' : '账号已恢复');
          await refresh(true);
        } catch (error) {
          toast(error.message, true);
        }
      }
      $('loginForm').addEventListener('submit', login);
      $('logoutButton').addEventListener('click', () => logout());
      $('refreshButton').addEventListener('click', () => refresh());
      document.addEventListener('click', (event) => {
        const b = event.target.closest('button');
        if (!b) return;
        if (b.dataset.view) switchView(b.dataset.view);
        if (b.dataset.go) switchView(b.dataset.go);
        if (b.dataset.storyFilter) {
          state.storyFilter = b.dataset.storyFilter;
          state.search = '';
          $('main').innerHTML = '<section class="view">' + skeletons() + '</section>';
          refresh(true);
        }
        if (b.dataset.userFilter) {
          state.userFilter = b.dataset.userFilter;
          render();
        }
        if (b.dataset.feedbackFilter) {
          state.feedbackFilter = b.dataset.feedbackFilter;
          render();
        }
        if (b.dataset.storyAction) moderate(b.dataset.id, b.dataset.storyAction);
        if (b.dataset.userAction) userStatus(b.dataset.id, b.dataset.userAction, b.dataset.name);
      });
      document.addEventListener('input', (event) => {
        if (event.target.id === 'storySearch' || event.target.id === 'userSearch') {
          const id = event.target.id,
            pos = event.target.selectionStart;
          state.search = event.target.value;
          render();
          const next = $(id);
          if (next) {
            next.focus();
            next.setSelectionRange(pos, pos);
          }
        }
      });
      const fragment = new URLSearchParams(location.hash.slice(1));
      if (fragment.get('token')) {
        state.token = fragment.get('token').trim();
        history.replaceState(null, '', location.pathname);
      }
      if (state.token) login();
    </script>
  </body>
</html>
