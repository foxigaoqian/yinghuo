      - id
      - body
      - visibility
      - confirmationState
      - version
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        visibility:
          type: string
          enum:
          - private
          - family
        confirmationState:
          type: string
          enum:
          - confirmed
          - rejected
          - suggested
        useForAi:
          type: boolean
        version:
          type: integer
        activeForBasic:
          type: boolean
        assetIds:
          type: array
          items: &id002
            type: string
            format: uuid
    MemoryResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Memory'
    MemoryListResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/CursorPageMemory'
    CursorPageMemory:
      type: object
      required:
      - items
      - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Memory'
        nextCursor:
          type: string
          nullable: true
    CreateUploadRequest:
      type: object
      required:
      - purpose
      - filename
      - mimeType
      - sizeBytes
      properties:
        profileId:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - memory_original
          - avatar
          - voice_material
          - image_input
          - export
        filename:
          type: string
          maxLength: 255
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
    UploadResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: object
            required:
            - uploadSessionId
            - expiresAt
            - uploadUrl
            properties:
              uploadSessionId:
                type: string
                format: uuid
              expiresAt:
                type: string
                format: date-time
              uploadUrl:
                type: string
                format: uri
              headers:
                type: object
                additionalProperties:
                  type: string
    AssetResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: object
            required:
            - assetId
            - status
            properties:
              assetId:
                type: string
                format: uuid
              status:
                type: string
                enum:
                - checking
                - ready
                - rejected
              rejectReason:
                type: string
    SendMessageRequest:
      type: object
      required:
      - clientMessageId
      - kind
      - conversationEpoch
      properties:
        clientMessageId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - text
          - image
        text:
          type: string
          minLength: 1
          maxLength: 10000
        conversationEpoch:
          type: integer
          minimum: 1
        assetId: *id002
      oneOf:
      - properties:
          kind:
            enum:
            - text
        required:
        - text
      - properties:
          kind:
            enum:
            - image
        required:
        - assetId
      description: image仅本人ready且授权资产；视觉未开启时只保存图片并提示补充说明，不调用模型伪造看图。
    GenerationResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: object
            required:
            - generationId
            - status
            properties:
              generationId:
                type: string
                format: uuid
              userMessageId:
                type: string
                format: uuid
              assistantMessageId:
                type: string
                format: uuid
              status:
                type: string
                enum:
                - queued
                - running
                - completed
                - failed
                - cancelled
              text:
                type: string
              nextSeq:
                type: integer
    GenerationEventsResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: object
            required:
            - events
            - nextSeq
            properties:
              events:
                type: array
                items:
                  type: object
                  required:
                  - seq
                  - type
                  properties:
                    seq:
                      type: integer
                    type:
                      type: string
                      enum:
                      - started
                      - text_delta
                      - completed
                      - failed
                      - cancelled
                      - snapshot_required
                    payload:
                      type: object
                      additionalProperties: true
              nextSeq:
                type: integer
    CreateQuoteRequest:
      type: object
      required:
      - productCode
      - operation
