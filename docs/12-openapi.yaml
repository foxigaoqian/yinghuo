components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: yinghuo_session
      description: HttpOnly、Secure、SameSite=Lax 或更严格的 H5 会话 Cookie
    adminCookie:
      type: apiKey
      in: cookie
      name: yinghuo_admin_session
      description: 独立后台MFA会话，不接受用户Cookie
  parameters:
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 被删对象当前十进制version；先验权，再比较版本
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
  responses:
    Unauthorized:
      description: 未登录或会话已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 资源不存在或当前账号无权识别
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态、版本或幂等冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationError:
      description: 输入不合格
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: 请求过于频繁
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    BaseResponse:
      type: object
      required:
      - data
      - traceId
      properties:
        data: {}
        traceId:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      - traceId
      properties:
        error:
          type: object
          required:
          - code
          - message
          - retryable
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            fieldErrors:
              type: object
              additionalProperties:
                type: string
        traceId:
          type: string
    User:
      type: object
      required:
      - id
      - displayName
      - timezone
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          maxLength: 80
        timezone:
          type: string
          example: Asia/Shanghai
        status:
          type: string
          enum:
          - active
          - suspended
          - deleting
          - deleted
    UserResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/User'
    OtpRequest:
      type: object
      required:
      - phone
      - purpose
      properties:
        phone:
          type: string
          description: 服务端规范化的手机号输入
        purpose:
          type: string
          enum:
          - login
          - change_phone
    OtpVerifyRequest:
      type: object
      required:
      - challengeId
      - code
      - acceptedTermsVersion
      - acceptedPrivacyVersion
      properties:
        challengeId:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
        acceptedTermsVersion:
          type: string
          maxLength: 80
        acceptedPrivacyVersion:
          type: string
          maxLength: 80
    OtpChallengeResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: object
            required:
            - challengeId
            - expiresAt
            - retryAfterSeconds
            properties:
              challengeId:
                type: string
                format: uuid
              expiresAt:
                type: string
                format: date-time
              retryAfterSeconds:
                type: integer
    BootstrapResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            type: object
            required:
            - appVersion
            - phase
            - features
            - products
            - terms
            - csrfToken
            - paymentCapabilities
            - canCreateFreeProfile
            properties:
              appVersion:
                type: string
              phase:
                type: string
                enum:
                - A
                - B
                - C1
                - C2
                - D
              features:
                type: object
                additionalProperties:
                  type: boolean
              products:
                type: array
                items:
                  $ref: '#/components/schemas/ProductVersion'
              terms:
                type: object
                additionalProperties:
                  type: string
              csrfToken:
                type: string
                maxLength: 200
              paymentCapabilities:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentCapability'
              canCreateFreeProfile: &id003
                type: boolean
    ProductVersion:
      type: object
      required:
      - code
      - version
      - priceFen
      - currency
      - termsVersion
      - saleEnabled
      properties:
        code:
          type: string
        version:
          type: integer
        priceFen:
          type: integer
          minimum: 0
        memberPriceFen:
          type: integer
          minimum: 0
        currency:
          type: string
          enum:
          - CNY
        durationDays:
          type: integer
        termsVersion:
          type: string
        saleEnabled:
          type: boolean
        specs:
          type: object
          additionalProperties: true
        catalogVersion:
          type: integer
          minimum: 1
          description: 商品聚合乐观锁版本，后台expectedVersion使用此值
        productId:
          type: string
          format: uuid
    CreateProfileRequest:
      type: object
      required:
      - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        relationship:
          type: string
          maxLength: 40
        callMe:
          type: string
          maxLength: 40
        avatarAssetId:
          type: string
          format: uuid
    UpdateProfileRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        relationship:
          type: string
          maxLength: 40
        avatarAssetId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 1
      required:
      - expectedVersion
    Profile:
      type: object
      required:
      - id
      - displayName
      - status
      - version
      - capabilities
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        relationship:
          type: string
        status:
          type: string
          enum:
          - draft
          - active
          - deleting
          - deleted
        version:
          type: integer
        capabilities:
          type: object
          additionalProperties:
            type: boolean
        counts:
          type: object
          additionalProperties:
            type: integer
        requiresPlan:
          type: boolean
        nextPage:
          type: string
          enum:
          - P19
          - P38
    ProfileResponse:
      allOf:
      - $ref: '#/components/schemas/BaseResponse'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/Profile'
    ProfileListResponse:
