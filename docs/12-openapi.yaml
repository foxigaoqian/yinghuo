openapi: 3.0.3
info:
  title: 萤火 V1 H5 API
  version: 1.1.0
  description: 移动端H5首发A/B契约。微信网页JSAPI与Stripe为按账号资格开放的条件通道；小程序、C/D功能另行实施。业务默认见17，后台权限见18。
servers:
- url: https://staging-api.example.com/api/v1
  description: 替换为实际 staging API 域名
- url: https://api.example.com/api/v1
  description: 替换为实际 production API 域名
tags:
- name: Bootstrap
- name: Auth
- name: Profiles
- name: Memories
- name: Uploads
- name: Chat
- name: Commerce
- name: Payments
- name: Support
paths:
  /bootstrap:
    get:
      tags:
      - Bootstrap
      summary: 获取前端能力、协议和商品入口
      security: []
      responses:
        '200':
          description: 当前应用配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponse'
      operationId: get_bootstrap
      x-phase: A
      parameters: []
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /auth/otp:
    post:
      tags:
      - Auth
      summary: 发送手机号验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '202':
          description: 验证码已进入发送流程
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallengeResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: post_auth_otp
      x-phase: A
      parameters: []
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /auth/otp/verify:
    post:
      tags:
      - Auth
      summary: 验证验证码并建立 H5 会话
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: 登录成功；服务端通过 HttpOnly Cookie 建立会话
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: post_auth_otp_verify
      x-phase: A
      parameters: []
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /auth/logout:
    post:
      tags:
      - Auth
      summary: 撤销当前会话
      responses:
        '204':
          description: 已退出
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: post_auth_logout
      x-phase: A
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /me:
    get:
      tags:
      - Auth
      summary: 获取当前账号
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get_me
      x-phase: A
      parameters: []
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
    patch:
      summary: 修改本人偏好
      operationId: patch_me
      tags:
      - me
      responses:
        '200':
          description: 成功（异步只代表受理）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResult'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      x-phase: A
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /profiles:
    get:
      tags:
      - Profiles
      summary: 获取当前账号可见的TA空间
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 空间列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get_profiles
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
    post:
      tags:
      - Profiles
      summary: 创建TA或可恢复草稿
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProfileRequest'
      responses:
        '201':
          description: 已创建空间或草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: post_profiles
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /profiles/{profileId}:
    parameters:
    - $ref: '#/components/parameters/ProfileId'
    get:
      tags:
      - Profiles
      summary: 获取TA空间摘要
      responses:
        '200':
          description: 当前账号可见的空间
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: get_profiles_profileId
      x-phase: A
      parameters: []
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
    patch:
      tags:
      - Profiles
      summary: 修改TA空间资料
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: patch_profiles_profileId
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /profiles/{profileId}/memories:
    parameters:
    - $ref: '#/components/parameters/ProfileId'
    get:
      tags:
      - Memories
      summary: 获取当前账号可见的记忆
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: visibility
        in: query
        schema:
          type: string
          enum:
          - private
          - family
      responses:
        '200':
          description: 记忆列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: get_profiles_profileId_memories
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
    post:
      tags:
      - Memories
      summary: 创建一条已确认记忆
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMemoryRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: post_profiles_profileId_memories
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /uploads:
    post:
      tags:
      - Uploads
      summary: 创建私有上传会话
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: 上传会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: 超过容量或单文件限制
        '422':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: post_uploads
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /uploads/{uploadSessionId}/complete:
    parameters:
    - name: uploadSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      tags:
      - Uploads
      summary: 完成上传并触发服务端校验
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 校验中的资产
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: post_uploads_uploadSessionId_complete
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /generations/{generationId}:
    parameters:
    - name: generationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Chat
      summary: 获取生成任务最终快照
      responses:
        '200':
          description: 生成状态和完整正文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: get_generations_generationId
      x-phase: A
      parameters: []
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /generations/{generationId}/events:
    parameters:
    - name: generationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Chat
      summary: 读取可恢复生成事件
      parameters:
      - name: afterSeq
        in: query
        schema:
          type: integer
          minimum: -1
          default: -1
      responses:
        '200':
          description: 事件列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationEventsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          description: 事件已过期，需要读取生成快照
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: get_generations_generationId_events
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /quotes:
    post:
      tags:
      - Commerce
      summary: 创建商品报价
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuoteRequest'
      responses:
        '201':
          description: 服务端计算的报价快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: post_quotes
      x-phase: A
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /orders:
    get:
      tags:
      - Commerce
      summary: 获取当前账号订单
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get_orders
      x-phase: B
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
    post:
      tags:
      - Commerce
      summary: 根据报价创建订单
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 订单快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: post_orders
      x-phase: B
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /orders/{orderId}:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    get:
      tags:
      - Commerce
      summary: 获取订单、支付、交付和退款状态
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: get_orders_orderId
      x-phase: B
      parameters: []
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /orders/{orderId}/payment:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - Payments
      summary: 创建或复用微信 H5 支付尝试
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '200':
          description: 短期支付跳转信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: 支付渠道暂不可用
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: post_orders_orderId_payment
      x-phase: B
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /orders/{orderId}/reconcile:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - Payments
      summary: 受控主动查单
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 当前服务端状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: post_orders_orderId_reconcile
      x-phase: B
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /orders/{orderId}/refunds:
    parameters:
    - $ref: '#/components/parameters/OrderId'
    post:
      tags:
      - Commerce
      summary: 提交售后退款申请
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
      responses:
        '201':
          description: 退款申请已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 会话无效
        '403':
          description: 已知能力/CSRF/scope拒绝
      operationId: post_orders_orderId_refunds
      x-phase: B
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /payments/wechat_h5/notify:
    post:
      tags:
      - Payments
      summary: 微信支付异步回调
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 已成功验签、解密并落账
        '400':
          description: 签名、解密或业务核对失败
        '500':
          description: 数据库或内部处理失败
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: post_payments_wechat_h5_notify
      x-phase: B
      parameters: []
      x-webhook-signature-required: true
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /refunds/wechat_h5/notify:
    post:
      tags:
      - Payments
      summary: 微信退款异步回调
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 已成功处理
        '400':
          description: 回调无效
        '500':
          description: 内部处理失败
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: post_refunds_wechat_h5_notify
      x-phase: B
      parameters: []
      x-webhook-signature-required: true
      description: 依17的幂等、权限及状态规则执行；私有对象越权返回404。
  /support-tickets:
    get:
      tags:
      - Support
      summary: 获取当前账号工单
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 工单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportTicketListResponse'
        '401':
